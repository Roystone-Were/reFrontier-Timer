<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reveal &amp; Awaken Timekeeper</title>
<meta name="theme-color" content="#0B1024">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>

  :root{
    --navy: #252D57;
    --navy-deep: #0B1024;
    --surface: #141B38;
    --surface-2: #1C244A;
    --line: #2B3560;
    --red: #C82D31;
    --orange: #DB7332;
    --teal: #56B2AA;
    --text: #F4F5FA;
    --text-dim: #8C93B0;
    --text-faint: #5B6288;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; height:100%;
    background: var(--navy-deep);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height: 100dvh;
    display:flex;
    flex-direction:column;
    padding: max(18px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(37,45,87,0.55), transparent 60%),
      var(--navy-deep);
  }

  .wrap{ max-width: 560px; margin: 0 auto; width:100%; display:flex; flex-direction:column; gap:22px; flex:1; }

  /* header */
  header{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:4px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand img{ height: 26px; width:auto; display:block; }
  .brand-sep{ width:1px; height:20px; background: var(--line); }
  .brand-title{ font-size: 12.5px; letter-spacing:.02em; color: var(--text-dim); line-height:1.25; }
  .brand-title strong{ color: var(--text); font-weight:600; display:block; font-size:13.5px; }

  /* live clock */
  .clock-card{
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 22px 20px 18px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .clock-card::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(90deg, var(--red), var(--orange) 45%, var(--teal));
    opacity:.9;
    height:3px;
    top:0;
  }
  .clock-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.14em; color: var(--text-faint); font-weight:600; margin-bottom:8px; }
  .clock-time{
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
    font-weight:600;
    font-size: clamp(2.6rem, 12vw, 3.6rem);
    letter-spacing: 0.01em;
    line-height:1;
    color: var(--text);
  }
  .clock-time .ampm{ font-size: 0.32em; color: var(--text-dim); margin-left:6px; font-weight:600; vertical-align: 12%; }

  /* next cue summary inside the clock card */
  .next-cue{
    margin-top:16px; padding-top:14px;
    border-top:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:center; flex-wrap:wrap; gap:4px 10px;
    font-size:14px; color: var(--text-dim);
    transition: color .3s ease;
  }
  .next-cue strong{ color: var(--text); font-weight:600; }
  .next-cue .nc-cd{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.25rem;
    font-variant-numeric: tabular-nums; color: var(--orange);
    transition: color .3s ease;
  }
  .next-cue.urgent .nc-cd{ color: var(--red); }
  .next-cue.finished{ color: var(--teal); }

  /* sound toggle */
  .toggle{
    display:flex; align-items:center; gap:7px;
    background: var(--surface); border:1px solid var(--line); border-radius:999px;
    color: var(--text-dim); font: 600 12.5px 'Inter',sans-serif;
    padding:7px 12px; cursor:pointer;
    transition: background .2s ease, border-color .2s ease, color .2s ease;
  }
  .toggle .dot{ width:8px; height:8px; border-radius:50%; background: var(--text-faint); transition: background .2s ease; }
  .toggle[aria-pressed="true"]{ color: var(--text); border-color: var(--teal); background: rgba(86,178,170,.12); }
  .toggle[aria-pressed="true"] .dot{ background: var(--teal); }
  .toggle:focus-visible{ outline:2px solid var(--orange); outline-offset:2px; }

  /* setter */
  .setter{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 18px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .setter-text{ flex:1; min-width:0; }
  .setter-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color: var(--text-faint); font-weight:600; margin-bottom:3px;}
  .setter-value{ font-family:'Space Grotesk',sans-serif; font-size:1.05rem; font-weight:600; color:var(--text); font-variant-numeric: tabular-nums; }
  .setter-value.unset{ color: var(--text-dim); font-weight:500; font-family:'Inter',sans-serif; font-size:0.95rem;}
  input[type="time"]{
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text);
    font-family:'Space Grotesk', sans-serif;
    font-size: 17px;
    font-weight:600;
    border-radius: 12px;
    padding: 10px 12px;
    width: 128px;
    color-scheme: dark;
  }
  input[type="time"]:focus{ outline: 2px solid var(--orange); outline-offset:1px; }

  /* timeline */
  .timeline{ display:flex; flex-direction:column; gap:0; position:relative; }
  .row{
    display:flex;
    align-items:center;
    gap:14px;
    padding: 15px 4px;
    position:relative;
  }
  .row + .row{ border-top: 1px solid var(--line); }

  .marker{
    flex-shrink:0;
    width:34px; height:34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14px;
    background: var(--surface-2);
    border: 1.5px solid var(--line);
    color: var(--text-dim);
    transition: all .3s ease;
  }
  .row.done .marker{ background: rgba(86,178,170,.15); border-color: var(--teal); color: var(--teal); }
  .row.active .marker{ background: var(--orange); border-color: var(--orange); color: var(--navy-deep); box-shadow: 0 0 0 6px rgba(219,115,50,.18); }
  .row.now .marker{ background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 0 0 8px rgba(200,45,49,.22); animation: pulse 1.1s ease-in-out infinite; }
  .row.anchor .marker{ background: var(--navy); border-color: var(--text-dim); color: var(--text); }

  @keyframes pulse{
    0%,100%{ box-shadow: 0 0 0 6px rgba(200,45,49,.25); }
    50%{ box-shadow: 0 0 0 12px rgba(200,45,49,.08); }
  }

  /* imminent: fires for the 10s leading up to a cue */
  .row.imminent{
    border-radius: 14px;
    animation: rowFlash .7s ease-in-out infinite;
  }
  .row.imminent .marker{
    animation: markerJolt .7s ease-in-out infinite;
  }
  .row.imminent .row-time{ color: var(--red); }
  .row.imminent .row-countdown{
    color: var(--red);
    font-size: 13.5px;
    font-weight:700;
  }

  @keyframes rowFlash{
    0%,100%{ background: rgba(200,45,49,.06); }
    50%{ background: rgba(200,45,49,.28); }
  }
  @keyframes markerJolt{
    0%,100%{ transform: scale(1); background: var(--red); border-color: var(--red); color:#fff; box-shadow: 0 0 0 5px rgba(200,45,49,.3); }
    50%{ transform: scale(1.18); background: var(--red); border-color: var(--red); color:#fff; box-shadow: 0 0 0 12px rgba(200,45,49,.05); }
  }

  #alertOverlay{
    position: fixed; inset:0; pointer-events:none; z-index: 50;
    box-shadow: inset 0 0 0 0 rgba(200,45,49,0);
    opacity:0;
  }
  #alertOverlay.flash{
    opacity:1;
    animation: screenFlash .7s ease-in-out infinite;
  }
  @keyframes screenFlash{
    0%,100%{ box-shadow: inset 0 0 40px 6px rgba(200,45,49,.15); }
    50%{ box-shadow: inset 0 0 110px 22px rgba(200,45,49,.6); }
  }

  @media (prefers-reduced-motion: reduce){
    .row.imminent, .row.imminent .marker, #alertOverlay.flash{ animation: none !important; }
    .row.imminent{ background: rgba(200,45,49,.22); }
    .row.imminent .marker{ background: var(--red); border-color: var(--red); color:#fff; }
    #alertOverlay.flash{ opacity:1; box-shadow: inset 0 0 60px 10px rgba(200,45,49,.35); }
  }

  .row-text{ flex:1; min-width:0; }
  .row-label{ font-size: 15.5px; font-weight:600; color: var(--text); }
  .row-sub{ font-size: 12.5px; color: var(--text-dim); margin-top:1px; }
  .row.done .row-label{ color: var(--text-dim); }

  .row-right{ text-align:right; flex-shrink:0; }
  .row-time{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size: 1.15rem;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    white-space:nowrap;
  }
  .row.done .row-time{ color: var(--text-dim); }
  .row-countdown{ font-size: 11.5px; margin-top:2px; font-weight:600; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .row.active .row-countdown{ color: var(--orange); }
  .row.now .row-countdown{ color: var(--red); }
  .row.done .row-countdown{ color: var(--teal); }

  .empty-hint{
    text-align:center;
    color: var(--text-dim);
    font-size: 14px;
    padding: 30px 20px;
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 16px;
  }

  footer{ text-align:center; font-size:11px; color: var(--text-faint); padding-top:4px; }
</style>
</head>

      <div class="clock-label">Live time</div>
      <div class="clock-time" id="liveClock" role="timer">--:--:-- <span class="ampm">--</span></div>

    </div>

    <div class="setter">
      <div class="setter-text">
        <div class="setter-label">Break ends at</div>

      <div class="empty-hint">Set the break end time above and cues will appear here.</div>
    </div>

<script>
(function(){
  var CUES = [
    { key:'team',  label:'Team back in room',      offset: 20*60,        anchor:false },
    { key:'door',  label:'Open the door',           offset: 10*60,        anchor:false },
    { key:'ann',   label:'Announce "1 min to music"', offset: 5*60+10,    anchor:false },
    { key:'music', label:'Start the music',          offset: 4*60+10,     anchor:false },
    { key:'end',   label:'Break ends',               offset: 0,           anchor:true  }
  ];

  var STORAGE_KEY = 'ra-timekeeper.breakTarget';
  var SOUND_KEY = 'ra-timekeeper.sound';
  var IMMINENT_WINDOW = 10; // seconds before a cue to trigger the attention effect
  var NOW_WINDOW = 8;       // seconds a cue stays in the "NOW" state
  var STALE_AFTER = 60*60;  // a break time more than an hour in the past is treated as tomorrow

  var breakTarget = null; // Date object
  var liveClockEl = document.getElementById('liveClock');
  var setterValueEl = document.getElementById('setterValue');
  var input = document.getElementById('breakInput');
  var timelineContainer = document.getElementById('timelineContainer');
  var alertOverlay = document.getElementById('alertOverlay');
  var nextCueEl = document.getElementById('nextCue');
  var soundToggle = document.getElementById('soundToggle');
  var soundLabel = document.getElementById('soundLabel');
  var wakeNote = document.getElementById('wakeNote');
  var emptyHintHTML = timelineContainer.innerHTML;
  var baseTitle = document.title;
  var rowEls = {};
  var lastBeep = {}; // cue key -> last whole-second countdown value we beeped on

  function pad(n){ return n < 10 ? '0'+n : ''+n; }

  function fmt12(date, withSeconds){
    var h = date.getHours();
    var m = date.getMinutes();
    var s = date.getSeconds();
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12; if(h12 === 0) h12 = 12;
    var str = h12 + ':' + pad(m) + (withSeconds ? (':' + pad(s)) : '');
    return { str: str, ampm: ampm };
  }

  function store(key, value){
    try{
      if(value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, value);
    }catch(e){}
  }
  function recall(key){
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }

  /* ---------- sound ---------- */
  var soundOn = recall(SOUND_KEY) !== 'off';
  var audioCtx = null;

  function renderSoundToggle(){
    soundToggle.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    soundLabel.textContent = soundOn ? 'Sound on' : 'Sound off';
  }

  // Browsers (iOS especially) only allow audio after a user gesture, so we
  // create/resume the context on the first tap or keypress.
  function unlockAudio(){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!audioCtx){ try{ audioCtx = new AC(); }catch(e){ return; } }
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }

  function beep(freq, duration){
    if(!soundOn || !audioCtx || audioCtx.state !== 'running') return;
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + duration + 0.05);
  }

  soundToggle.addEventListener('click', function(){
    soundOn = !soundOn;
    store(SOUND_KEY, soundOn ? 'on' : 'off');
    renderSoundToggle();
    unlockAudio();
    if(soundOn) beep(880, 0.15);
  });
  ['pointerdown','keydown','touchstart'].forEach(function(evt){
    document.addEventListener(evt, unlockAudio, { passive:true });
  });

  /* ---------- keep the screen awake ---------- */
  var wakeLock = null;
  function requestWakeLock(){
    if(!breakTarget || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    if(wakeLock) return;
    navigator.wakeLock.request('screen').then(function(lock){
      wakeLock = lock;
      wakeNote.textContent = ' · Screen stays on';
      lock.addEventListener('release', function(){
        wakeLock = null;
        wakeNote.textContent = '';
      });
    }).catch(function(){});
  }
  function releaseWakeLock(){
    if(wakeLock){ wakeLock.release(); wakeLock = null; }
  }
  // The lock is dropped automatically when the tab is hidden; take it back on return.
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){ requestWakeLock(); tick(); }
  });

  /* ---------- rendering ---------- */
  function tickLiveClock(now){
    var f = fmt12(now, true);
    liveClockEl.innerHTML = f.str + ' <span class="ampm">' + f.ampm + '</span>';
  }

  function buildRows(){
    timelineContainer.innerHTML = '';
    rowEls = {};
    var tl = document.createElement('div');
    tl.className = 'timeline';
    CUES.forEach(function(cue, i){
      var row = document.createElement('div');
      row.className = 'row' + (cue.anchor ? ' anchor' : '');
      row.id = 'row-' + cue.key;

      var marker = document.createElement('div');
      marker.className = 'marker';
      marker.textContent = cue.anchor ? '⚑' : String(i+1);

      var text = document.createElement('div');
      text.className = 'row-text';
      var label = document.createElement('div');
      label.className = 'row-label';
      label.textContent = cue.label;
      var sub = document.createElement('div');
      sub.className = 'row-sub';
      sub.textContent = cue.anchor ? 'Target time' : mmssLabel(cue.offset) + ' before';
      text.appendChild(label);
      text.appendChild(sub);

      var right = document.createElement('div');
      right.className = 'row-right';
      var time = document.createElement('div');
      time.className = 'row-time';
      time.textContent = '--:--';
      var cd = document.createElement('div');
      cd.className = 'row-countdown';
      cd.textContent = '';
      right.appendChild(time);
      right.appendChild(cd);

      row.appendChild(marker);
      row.appendChild(text);
      row.appendChild(right);
      tl.appendChild(row);

      rowEls[cue.key] = { row: row, marker: marker, time: time, cd: cd };
    });
    timelineContainer.appendChild(tl);
  }

  function mmssLabel(totalSeconds){
    var abs = Math.abs(totalSeconds);
    var m = Math.floor(abs / 60);
    var s = abs % 60;
    if(m === 0) return s + ' sec';
    if(s === 0) return m + ' min';
    return m + ':' + pad(s) + ' min';
  }

  // Counts up to the cue so "in 0:01" is shown until the moment it actually fires.
  function mmss(seconds){
    var m = Math.floor(seconds/60), s = seconds%60;
    return m + ':' + pad(s);
  }

  function updateRows(now){
    if(!breakTarget){
      nextCueEl.className = 'next-cue';
      nextCueEl.textContent = 'Set the break end time to begin';
      document.title = baseTitle;
      alertOverlay.classList.remove('flash');
      return;
    }
    var anyImminent = false;
    var soonest = null, soonestDiff = Infinity;

    CUES.forEach(function(cue){
      var cueTime = new Date(breakTarget.getTime() - cue.offset*1000);
      var refs = rowEls[cue.key];
      var f = fmt12(cueTime, true);
      refs.time.textContent = f.str + ' ' + f.ampm;

      var diff = (cueTime.getTime() - now.getTime())/1000;
      var secsLeft = Math.ceil(diff);

      refs.row.classList.remove('done','active','now','imminent');

      if(diff <= 0 && diff > -NOW_WINDOW){
        refs.row.classList.add('now');
        refs.cd.textContent = 'NOW';
        if(lastBeep[cue.key] !== 0 && diff > -2){
          beep(1320, 0.6);
          if(navigator.vibrate) navigator.vibrate([300,100,300]);
        }
        lastBeep[cue.key] = 0;
      } else if(diff <= 0){
        refs.row.classList.add('done');
        refs.cd.textContent = 'done';
      } else {
        refs.cd.textContent = 'in ' + mmss(secsLeft);
        if(diff < soonestDiff){ soonestDiff = diff; soonest = cue; }
        if(diff <= IMMINENT_WINDOW){
          refs.row.classList.add('imminent');
          anyImminent = true;
          if(secsLeft === IMMINENT_WINDOW && lastBeep[cue.key] !== secsLeft && navigator.vibrate){
            navigator.vibrate([120,60,120]);
          }
          // short pips on the final 3 seconds
          if(secsLeft <= 3 && lastBeep[cue.key] !== secsLeft) beep(880, 0.12);
          lastBeep[cue.key] = secsLeft;
        } else {
          lastBeep[cue.key] = null;
        }
      }
    });

    // mark the single soonest upcoming cue as "active" for emphasis
    if(soonest){
      rowEls[soonest.key].row.classList.add('active');
      var left = mmss(Math.ceil(soonestDiff));
      nextCueEl.className = 'next-cue' + (soonestDiff <= IMMINENT_WINDOW ? ' urgent' : '');
      nextCueEl.innerHTML = '';
      var lbl = document.createElement('span');
      lbl.innerHTML = 'Next: <strong></strong>';
      lbl.querySelector('strong').textContent = soonest.label;
      var cd = document.createElement('span');
      cd.className = 'nc-cd';
      cd.textContent = left;
      nextCueEl.appendChild(lbl);
      nextCueEl.appendChild(cd);
      document.title = left + ' · ' + soonest.label;
    } else {
      nextCueEl.className = 'next-cue finished';
      nextCueEl.textContent = 'Break has ended. All cues done.';
      document.title = baseTitle;
      releaseWakeLock();
    }

    alertOverlay.classList.toggle('flash', anyImminent);
  }

  /* ---------- setting the break time ---------- */
  function setBreakTarget(target){
    breakTarget = target;
    lastBeep = {};
    if(!target){
      store(STORAGE_KEY, null);
      setterValueEl.textContent = 'Not set';
      setterValueEl.classList.add('unset');
      timelineContainer.innerHTML = emptyHintHTML;
      rowEls = {};
      releaseWakeLock();
      updateRows(new Date());
      return;
    }
    store(STORAGE_KEY, String(target.getTime()));
    var f = fmt12(target, false);
    var tomorrow = target.toDateString() !== new Date().toDateString();
    setterValueEl.textContent = f.str + ' ' + f.ampm + (tomorrow ? ' (tomorrow)' : '');
    setterValueEl.classList.remove('unset');
    input.value = pad(target.getHours()) + ':' + pad(target.getMinutes());
    if(!rowEls.end) buildRows();
    requestWakeLock();
    updateRows(new Date());
  }

  function applyBreakTime(){
    var val = input.value; // "HH:MM"
    if(!val){ setBreakTarget(null); return; }
    var parts = val.split(':');
    var h = parseInt(parts[0],10), m = parseInt(parts[1],10);
    if(isNaN(h) || isNaN(m)) return;
    var now = new Date();
    var target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0);
    // A time that only just passed is still today's break (cues show as done);
    // only roll to tomorrow when it is well in the past.
    if(target.getTime() < now.getTime() - STALE_AFTER*1000){
      target.setDate(target.getDate()+1);
    }
    setBreakTarget(target);
  }

  input.addEventListener('change', applyBreakTime);
  input.addEventListener('input', applyBreakTime);

  /* ---------- clock loop, aligned to the second boundary ---------- */
  function tick(){
    var now = new Date();
    tickLiveClock(now);
    updateRows(now);
  }
  function loop(){
    tick();
    setTimeout(loop, 1000 - (Date.now() % 1000) + 5);
  }

  renderSoundToggle();

  // restore a break time saved before a refresh or accidental close
  var saved = parseInt(recall(STORAGE_KEY), 10);
  if(saved && saved > Date.now() - STALE_AFTER*1000){
    setBreakTarget(new Date(saved));
  } else {
    store(STORAGE_KEY, null);
  }

  loop();
})();
</script>
</body>
</html>
